openapi: 3.0.4
info:
  title: Spell Checker
  description: >-
    Spell Checker flags misspelled words in submitted English text and generates
    correction suggestions. It counts total spelling errors, lists possible
    replacements for each mistaken word, and can return the text with the top
    suggestions applied, plus on paid plans the character offsets of every
    misspelling.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/spellchecker:
    post:
      summary: Spell Checker
      description: >-
        Check the spelling of a body of text, optionally returning the
        autocorrected text and the position of each misspelling
      operationId: spellchecker
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  spellPass: false
                  mispellingsFound: 2
                  totalOccurrences: 2
                  corrections:
                    - word: neeed
                      suggestions:
                        - needed
                        - need
                        - needy
                        - Neel
                        - needs
                      occurrences: 1
                      offsets:
                        - start: 2
                          end: 7
                    - word: telephine
                      suggestions:
                        - telephone
                        - telephoned
                        - telephoner
                        - telephones
                        - telephony
                      occurrences: 1
                      offsets:
                        - start: 29
                          end: 38
                  correctedText: I needed to call my friend on telephone today!
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to check the spelling of
                autocorrect:
                  type: boolean
                  description: >-
                    Include correctedText, the submitted text with each
                    misspelling replaced by its first suggestion
                offsets:
                  type: boolean
                  description: >-
                    Include the start and end character position of every
                    occurrence of each misspelled word
              required:
                - text
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  text: I neeed to call my friend on telephine today!
  autocorrect: true
  offsets: true
